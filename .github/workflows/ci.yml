name: Game checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run build:portable
      - uses: actions/upload-artifact@v4
        with:
          name: starrail-landlord-web
          path: dist
      - uses: actions/upload-artifact@v4
        with:
          name: starrail-landlord-portable
          path: artifacts/星穹转轮-v*.html
          if-no-files-found: error
